name: CI e deploy do BellaFlix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verificar arquivos e sintaxe JavaScript
        run: |
          test -s index.html
          find js -name '*.js' -type f -exec node --check {} \;
      - name: Preparar arquivos para o GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
